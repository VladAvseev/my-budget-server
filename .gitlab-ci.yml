# Пайплайн: lint → typecheck → build, деплой api, зеркало в GitHub.

stages:
  - build
  - deploy
  - mirror

variables:
  # Тот же Node, что в Dockerfile
  NODE_IMAGE: node:22-alpine

# Этап 1: проверка и сборка (.env не нужен: tsc/eslint dotenv не читают)
build:
  stage: build
  image: $NODE_IMAGE
  before_script:
    - npm ci
  script:
    - npm run lint
    - npm run typecheck
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  only:
    - develop

# Этап 2: деплой api (только после DEPLOY_SSH_KEY; база и web не трогаются).
# На сервере: hard-reset на origin/develop и пересборка только api.
# DEPLOY_HOST/DEPLOY_USER — обычные переменные проекта.
deploy-api:
  stage: deploy
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $DEPLOY_SSH_KEY'
  timeout: 15m
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    # CRLF-страховка ключа из веб-формы GitLab
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    # Засев CONSENT_ENC_KEY в прод-.env (однократно, без перезаписи):
    # секрет — по stdin, не в аргументах. Без ключа джоба падает, а не деплоит
    # сервер с 500 на регистрации и принятии согласия. Переменная: Masked, без Protected.
    - >
      printf '%s\n' "$CONSENT_ENC_KEY"
      | ssh "$DEPLOY_USER@$DEPLOY_HOST"
      "cd /opt/mybudget/server
      && if grep -q '^CONSENT_ENC_KEY=' .env 2>/dev/null; then echo 'CONSENT_ENC_KEY уже в .env';
      elif read -r k && [ -n \"\$k\" ]; then umask 077
      && printf 'CONSENT_ENC_KEY=%s\n' \"\$k\" >> .env && echo 'CONSENT_ENC_KEY дописан в .env';
      else echo 'CONSENT_ENC_KEY: нет ни в .env, ни в переменных GitLab' >&2; exit 1; fi"
    - >
      ssh "$DEPLOY_USER@$DEPLOY_HOST"
      "cd /opt/mybudget/server
      && git fetch origin develop
      && git checkout develop
      && git reset --hard origin/develop
      && docker compose up -d --build api"

# Этап 3: зеркало в GitHub (ключ SSH_PRIVATE_KEY_MIRROR, deploy key с записью).
mirror-to-github:
  stage: mirror
  only:
    - develop
  variables:
    # Shallow-клон ломает push (thin-pack) — нужен полный (GIT_DEPTH: 0)
    GIT_DEPTH: 0
  before_script:
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY_MIRROR" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan github.com >> ~/.ssh/known_hosts
    - git remote add github git@github.com:VladAvseev/my-budget-server.git
  script:
    # Зеркало однонаправленное (--force) и самодостаточное (--no-thin)
    - git push --no-thin --force github "HEAD:refs/heads/${CI_COMMIT_REF_NAME}"
