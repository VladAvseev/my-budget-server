# Пайплайн сервера my-budget: npm ci → lint → typecheck → build,
# деплой docker-образа api на боевой сервер, зеркало репозитория в GitHub.

stages:
  - build
  - deploy
  - mirror

variables:
  # Тот же образ Node, что в Dockerfile api
  NODE_IMAGE: node:22-alpine

# ─────────────────────────────────────────────────────────────────────────────
# Этап 1: проверка и сборка Express-бэкенда
# .env в CI не создаём (в отличие от клиента): tsc/eslint не читают dotenv,
# а рантайм-конфигурация (DATABASE_URL, JWT_SECRET) серверу при сборке не нужен.
# ─────────────────────────────────────────────────────────────────────────────
build:
  stage: build
  image: $NODE_IMAGE
  before_script:
    - npm ci
  script:
    - npm run lint
    - npm run typecheck
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  only:
    - develop

# ─────────────────────────────────────────────────────────────────────────────
# Этап 2: деплой api на сервер (Reg.ru, docker compose)
# Джоба существует только когда в Variables заведён DEPLOY_SSH_KEY —
# до этого пайплайн остаётся прежним (сборка+зеркало).
# Ключ DEPLOY_SSH_KEY — приватная часть gitlab_deploy с сервера
# (root@server: /root/.ssh/gitlab_deploy), публичная — в authorized_keys.
# На сервере CI делает hard-reset клона на origin/develop и пересобирает
# ТОЛЬКО сервис api: база и web при этом не трогаются.
# DEPLOY_HOST/DEPLOY_USER — обычные (не Mask) переменные того же проекта.
# ─────────────────────────────────────────────────────────────────────────────
deploy-api:
  stage: deploy
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $DEPLOY_SSH_KEY'
  timeout: 15m
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    # tr -d '\r' — страховка от CRLF при вставке ключа в веб-форму GitLab
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    # Засев CONSENT_ENC_KEY в прод-.env из masked-переменной GitLab:
    # однократно — существующий ключ не перезаписываем (старые записи
    # consent_log расшифровываются только исходным ключом, ротация — руками).
    # Значение идёт по stdin, чтобы секрет не светился в аргументах ssh/ps
    # на сервере. Если ключа нет ни в .env, ни в переменных — джоба падает,
    # а не деплоит сервер с 500 на принятии согласия и регистрации.
    # Переменная в GitLab: Masked, БЕЗ Protected (develop не protected-ветка).
    - >
      printf '%s\n' "$CONSENT_ENC_KEY"
      | ssh "$DEPLOY_USER@$DEPLOY_HOST"
      "cd /opt/mybudget/server
      && if grep -q '^CONSENT_ENC_KEY=' .env 2>/dev/null; then echo 'CONSENT_ENC_KEY уже в .env';
      elif read -r k && [ -n \"\$k\" ]; then umask 077
      && printf 'CONSENT_ENC_KEY=%s\n' \"\$k\" >> .env && echo 'CONSENT_ENC_KEY дописан в .env';
      else echo 'CONSENT_ENC_KEY: нет ни в .env, ни в переменных GitLab' >&2; exit 1; fi"
    - >
      ssh "$DEPLOY_USER@$DEPLOY_HOST"
      "cd /opt/mybudget/server
      && git fetch origin develop
      && git checkout develop
      && git reset --hard origin/develop
      && docker compose up -d --build api"

# ─────────────────────────────────────────────────────────────────────────────
# Этап 3: зеркало в GitHub (по образцу mirror-to-github клиента)
# Приватный SSH-ключ берётся из переменной GitLab SSH_PRIVATE_KEY_MIRROR
# (Settings → CI/CD → Variables, без Mask/Protect). Публичная часть этого ключа
# добавлена в Deploy keys репозитория VladAvseev/my-budget-server с правом
# записи (Allow write access) — иначе github отклонит push.
# ─────────────────────────────────────────────────────────────────────────────
mirror-to-github:
  stage: mirror
  only:
    - develop
  variables:
    # GitLab по умолчанию делает shallow-клон (--depth 20): thin-pack из такого
    # клона при push на GitHub ссылается на дельта-базы за пределами окна
    # ("remote unpack failed: did not receive expected object") — нужен полный клон.
    GIT_DEPTH: 0
  before_script:
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY_MIRROR" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan github.com >> ~/.ssh/known_hosts
    - git remote add github git@github.com:VladAvseev/my-budget-server.git
  script:
    # --force: зеркало однонаправленное (GitLab → GitHub), расходимость перезаписываем
    # --no-thin: самодостаточный пак, без внешних дельта-баз на стороне GitHub
    - git push --no-thin --force github "HEAD:refs/heads/${CI_COMMIT_REF_NAME}"
