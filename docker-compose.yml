# Стек: PostgreSQL (db) + Express API (api) + фронтенд с прокси /api/ (web).
# Секреты — в .env рядом (в .gitignore), в образы и git не попадают.
#
# На сервере (/opt/mybudget/server): up -d --build, ps, logs -f api,
# exec db psql -U mybudget -d mybudget (консоль БД).

name: mybudget

services:
  # База данных
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Без значений в .env compose не стартует
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB не задан в server/.env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER не задан в server/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в server/.env}
    # Под сервер 2 vCPU / 2 ГБ (пул приложения max=5 — с запасом)
    command: postgres -c shared_buffers=256MB -c max_connections=50 -c effective_cache_size=768MB
    volumes:
      # Данные переживают пересоздание контейнера
      - pgdata:/var/lib/postgresql/data
      # schema.sql — только при ПЕРВОМ старте; дальше — db/migrations через psql
      # (см. server/AGENTS.md), schema.sql обновлять для свежих установок.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      # api ждёт готовности postgres, а не контейнера
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Порты не публикуем: БД доступна только из сети mybudget

  # Express API
  api:
    build: .
    restart: unless-stopped
    # DATABASE_URL/JWT_SECRET/PORT из .env
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # Соседям (web → api:5001), наружу не торчит
    expose:
      - "5001"
    # Исходники юрдокументов (ro): CLI публикации читает их отсюда.
    # Канон — таблица legal_documents; bind без копирования.
    volumes:
      - ./docs/legal:/docs:ro

  # Фронтенд (клон client рядом): /api/ → api:5001, секретов не требует.
  web:
    # Контекст ../client; секретов нет (same-origin '/api/v1').
    build: ../client
    restart: unless-stopped
    ports:
      # Единственный вход снаружи: localhost; TLS — хостовый nginx
      - "127.0.0.1:8080:80"
    depends_on:
      - api

volumes:
  pgdata:
